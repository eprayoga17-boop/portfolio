name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      # Fail on known vulnerabilities in production dependencies (OWASP A06)
      - run: npm audit --omit=dev --audit-level=high
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Migration, seed and RLS tests
        run: |
          P="psql -v ON_ERROR_STOP=1 -q -h localhost -U postgres"
          $P -c "create database t"
          $P -d t -f supabase/tests/supabase_shim.sql
          $P -d t -f supabase/migrations/20261003000000_init.sql
          $P -d t -f supabase/seed.sql
          $P -d t -f supabase/tests/rls_test.sql
